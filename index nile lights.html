<fieldset><legend>4. تقييم الشكل والتغليف</legend><div class="rating"><input id="p5" type="radio" name="packaging" value="5" required><label for="p5">★</label><input id="p4" type="radio" name="packaging" value="4"><label for="p4">★</label><input id="p3" type="radio" name="packaging" value="3"><label for="p3">★</label><input id="p2" type="radio" name="packaging" value="2"><label for="p2">★</label><input id="p1" type="radio" name="packaging" value="1"><label for="p1">★</label></div></fieldset>
